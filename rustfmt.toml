edition = "2024"
style_edition = "2024"
max_width = 100

# Nightly-only. Stable rustfmt ignores everything below and leaves comments
# untouched, which is why CI formats with `cargo +nightly fmt`.
unstable_features = true
comment_width = 80
wrap_comments = true
format_code_in_doc_comments = true
group_imports = "StdExternalCrate"
imports_granularity = "Module"
