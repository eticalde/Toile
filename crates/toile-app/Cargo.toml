[package]
name = "toile-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Hard architectural rule: toile-app imports toile-engine only. Never add
# toile-sim / toile-mesh / toile-doc here — everything goes through the
# engine's headless API.
[dependencies]
bytemuck = "1"
eframe = { version = "0.36.1", features = ["wgpu"] }
toile-engine = { path = "../toile-engine" }

[lints]
workspace = true
