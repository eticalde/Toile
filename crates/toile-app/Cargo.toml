[package]
name = "toile-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Hard architectural rule: toile-app imports toile-engine only. Never add
# toile-sim / toile-mesh / toile-doc here — everything goes through the
# engine's headless API.
[dependencies]
bytemuck = "1"
eframe = { version = "0.36.1", features = ["wgpu"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toile-engine = { path = "../toile-engine" }

# The local clock's offset from UTC, for the day a session with the tape is
# dated. One call into the C library instead of a time zone database.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
