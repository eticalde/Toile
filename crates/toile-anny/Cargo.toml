[package]
name = "toile-anny"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Intentionally no [dependencies]: the runtime only decodes an embedded byte
# blob with std math, so the golden path never grows a chain of crates under
# it. The bake that turned the CC0 MakeHuman/MPFB2 source data into that blob
# needs JSON and gzip; it lives in toile-cli, which already carries
# dependencies, and this crate defines only the asset's format (the writer
# the baker calls and the reader this crate uses) so the two sides of the
# format cannot drift apart. `Station` and `BodyMesh` live here too now —
# this is the one crate every mesh producer and every importer shares them
# through.
[dependencies]

[lints]
workspace = true
