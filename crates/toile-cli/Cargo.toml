[package]
name = "toile-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "toile"
path = "src/main.rs"

[dependencies]
toile-anny = { path = "../toile-anny" }
toile-engine = { path = "../toile-engine" }
toile-doc = { path = "../toile-doc" }
toile-mesh = { path = "../toile-mesh" }
toile-seamly = { path = "../toile-seamly" }
toile-sim = { path = "../toile-sim" }
# Only the anny-bake subcommand needs it, to read the CC0 `.target.gz`
# morph targets — toile-anny itself stays dependency-free.
flate2 = "1"
rayon = "1"
serde_json = "1"

# Asking whether the process that staged a temporary file is still there, so a
# copy left in the owner's library by a run that was killed can be removed and
# a running one's cannot.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
