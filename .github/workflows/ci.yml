name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Floor-hardware datapoints: Linux 4 vCPU and Apple Silicon.
  bench:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p toile-cli -- bench

  test:
    strategy:
      fail-fast: false
      matrix:
        # The two platforms the determinism goldens compare across.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Nightly only supplies rustfmt: comment formatting is nightly-only, and
      # formatting never reaches the binary. Everything else builds on stable.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --all --check
      - run: ./tools/check-style.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      # Determinism goldens, in release: the same constant on ARM and x86.
      - run: cargo test --workspace --release -- --ignored
